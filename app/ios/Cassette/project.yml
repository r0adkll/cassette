# The iPhone app (decision 0016). Generate the Xcode project with
# `xcodegen generate --spec app/ios/Cassette/project.yml`; the .xcodeproj isn't committed.
name: Cassette
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: N6RWL4DC5S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Gradle build phase reads and writes outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Cassette:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: Cassette.entitlements
      properties:
        # The pre-ride nudge, like Android's high-importance channel.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Cassette
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: >-
          Cassette listens for your bike's SRAM AXS components to read their batteries. It never
          changes their settings.
        CFBundleURLTypes:
          - CFBundleURLName: com.r0adkll.cassette
            CFBundleURLSchemes: [cassette]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Compose draws at the display's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r0adkll.cassette
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, CassetteKit, -lsqlite3]
      configs:
        # Local builds sit beside TestFlight's on the same phone.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.r0adkll.cassette.debug
    scheme:
      testTargets: [CassetteUITests]
    preBuildScripts:
      - name: Build CassetteKit
        basedOnDependencyAnalysis: false
        script: |
          # Xcode doesn't see the shell's JAVA_HOME.
          [ -z "$JAVA_HOME" ] && export JAVA_HOME="$(/usr/libexec/java_home)"
          cd "$SRCROOT/../../.."
          ./gradlew :app:ios:embedAndSignAppleFrameworkForXcode
  # Drives the app on a Simulator (scripts/ios-uitest), without touching the desktop.
  CassetteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cassette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r0adkll.cassette.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cassette
