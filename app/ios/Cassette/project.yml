# The iPhone app (decision 0017). Generate the Xcode project with `scripts/xcodegen`, which sets
# CASSETTE_VERSION; the .xcodeproj isn't committed.
name: Cassette
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
# Crash reports (decision 0020): only the iPhone app links Firebase.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.0.1
settings:
  base:
    DEVELOPMENT_TEAM: N6RWL4DC5S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # `cassette.version` from gradle.properties, as on Android.
    MARKETING_VERSION: "${CASSETTE_VERSION}"
    CURRENT_PROJECT_VERSION: "1"
    # The app's id; the widget extension and the App Group are named after it.
    APP_BUNDLE_ID: com.r0adkll.cassette
    # The Gradle build phase reads and writes outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # CassetteKit is built for arm64 Simulators only (iosSimulatorArm64).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  configs:
    # Local builds sit beside TestFlight's on the same phone, each with its own App Group.
    Debug:
      APP_BUNDLE_ID: com.r0adkll.cassette.debug
targets:
  Cassette:
    type: application
    platform: iOS
    # Shared: the Live Activity's attributes and intents, also built into the extension.
    sources: [Sources, Shared]
    entitlements:
      path: Cassette.entitlements
      properties:
        # The pre-ride nudge, like Android's high-importance channel.
        com.apple.developer.usernotifications.time-sensitive: true
        # The widgets' snapshot (decision 0017).
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Cassette
        # XcodeGen writes 1.0 and 1 otherwise, ignoring the settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Where WidgetPublisher writes the widgets' snapshot.
        CassetteAppGroup: group.$(APP_BUNDLE_ID)
        # The refresh's Live Activity (iteration 16).
        NSSupportsLiveActivities: true
        # fetch: the daily not-seen reminders run as a background app refresh.
        UIBackgroundModes: [bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.r0adkll.cassette.reminders]
        NSBluetoothAlwaysUsageDescription: >-
          Cassette listens for your bike's SRAM AXS components to read their batteries. It never
          changes their settings.
        CFBundleURLTypes:
          - CFBundleURLName: com.r0adkll.cassette
            CFBundleURLSchemes: [cassette]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Compose draws at the display's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Crash reports wait for Settings → About → Send crash reports (decision 0020).
        FirebaseCrashlyticsCollectionEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # Drawn from the Android icon by scripts/generate-ios-icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, CassetteKit, -lsqlite3]
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
    dependencies:
      - target: CassetteWidgets
      - target: CassetteWatch
      - package: Firebase
        product: FirebaseCrashlytics
    scheme:
      testTargets: [CassetteUITests, CassetteWidgetsTests]
    preBuildScripts:
      - name: Build CassetteKit
        basedOnDependencyAnalysis: false
        script: |
          # Xcode doesn't see the shell's JAVA_HOME.
          [ -z "$JAVA_HOME" ] && export JAVA_HOME="$(/usr/libexec/java_home)"
          cd "$SRCROOT/../../.."
          ./gradlew :app:ios:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # Release only (decision 0020): the Firebase config, when there is one (it isn't committed;
      # scripts/firebase-wizard makes it), then the dSYM upload Crashlytics symbolicates with.
      - name: Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          config="$SRCROOT/Firebase/GoogleService-Info.plist"
          if [ "$CONFIGURATION" != "Release" ] || [ ! -f "$config" ]; then
            echo "No crash reports in this build ($CONFIGURATION)."
            exit 0
          fi
          cp "$config" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
  # Drives the app on a Simulator (scripts/ios-uitest), without touching the desktop.
  CassetteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cassette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r0adkll.cassette.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cassette
  # WidgetKit widgets (decision 0017, iteration 15): SwiftUI over the App Group's snapshot.
  CassetteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      # The snapshot, its look and icons, shared with the watch.
      - path: Snapshot
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_condensed_bold.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_medium.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_semibold.ttf
        buildPhase: resources
    entitlements:
      path: Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Cassette
        # XcodeGen writes 1.0 and 1 otherwise, ignoring the settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [barlow_condensed_bold.ttf, barlow_medium.ttf, barlow_semibold.ttf]
        CassetteAppGroup: group.$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
  # Renders every widget, family and state to PNGs (scripts/ios-uitest exports them), like the
  # Kotlin screen renders: the widget views without the extension's entry point.
  CassetteWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WidgetTests
      - path: Widgets
        excludes: [CassetteWidgets.swift, Info.plist]
      - path: Shared
      - path: Snapshot
      # The watch's views draw on iOS too, at a watch's size.
      - path: Watch/WatchViews.swift
      - path: WatchWidgets/ComplicationViews.swift
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_condensed_bold.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_medium.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_semibold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r0adkll.cassette.widgettests
        GENERATE_INFOPLIST_FILE: YES
  # The Apple Watch app (decision 0017, iteration 17): SwiftUI over the snapshot the iPhone sends
  # over WatchConnectivity. Embedded in the iPhone app; it needs the phone.
  CassetteWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Snapshot
        excludes: [PickBike.swift]
      - path: Shared/EpochMillis.swift
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_condensed_bold.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_medium.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_semibold.ttf
        buildPhase: resources
    entitlements:
      path: Watch.entitlements
      properties:
        # The complications read the snapshot the watch app keeps here.
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Cassette
        # XcodeGen writes 1.0 and 1 otherwise, ignoring the settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts: [barlow_condensed_bold.ttf, barlow_medium.ttf, barlow_semibold.ttf]
        CassetteAppGroup: group.$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
    dependencies:
      - target: CassetteWatchWidgets
  # The watch's complications and Smart Stack card (iteration 17).
  CassetteWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Snapshot
      - path: Shared/EpochMillis.swift
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_condensed_bold.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_medium.ttf
        buildPhase: resources
      - path: ../../../common/compose/src/commonMain/composeResources/font/barlow_semibold.ttf
        buildPhase: resources
    entitlements:
      path: WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cassette
        # XcodeGen writes 1.0 and 1 otherwise, ignoring the settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [barlow_condensed_bold.ttf, barlow_medium.ttf, barlow_semibold.ttf]
        CassetteAppGroup: group.$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.widgets
schemes:
  # Only the widget and watch renders, without building the app (or needing watchOS installed).
  CassetteRenders:
    build:
      targets:
        CassetteWidgetsTests: [test]
    test:
      targets: [CassetteWidgetsTests]
