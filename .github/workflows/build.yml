name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  danger:
    name: Danger
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    # The default token can't read pull requests in a private repo without these.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      issues: write
    container:
      image: docker://ghcr.io/r0adkll/danger-kotlin:2.0.8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run Danger
        run: danger-kotlin ci --failOnErrors --no-publish-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache ktfmt
        uses: actions/cache@v6
        with:
          path: ~/.cache/cassette
          key: ktfmt-${{ hashFiles('gradle/libs.versions.toml') }}

      # The ktfmt CLI, without Gradle: fails in seconds, and covers build-logic too.
      - name: Check formatting
        run: scripts/ktfmt

  # The required check: unit tests and a debug compile, without secrets.
  android:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew jvmTest testAndroidHostTest :poc:testDebugUnitTest :surfaces:tile:testDebugUnitTest :app:wear:testDebugUnitTest verifySqlDelightMigration

      - name: Compile
        run: ./gradlew :app:android:assembleDebug :app:wear:assembleDebug :poc:assembleDebug

      - name: Upload design gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-gallery
          path: |
            common/compose/build/gallery/*.png
            features/*/ui/build/screens/*.png
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/android/build/outputs/apk/debug/*.apk
            app/wear/build/outputs/apk/debug/*.apk
            poc/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # The R8-optimised internal build, once the compile passes. Not a required check: a slow or
  # failing R8 run doesn't hold up a merge. Uploads it to Drop (decision 0008): main to the main
  # channel, pull requests to pr/<number>. Drop needs the internal key, and an OIDC token, which
  # forks can't get.
  internal:
    name: Internal build
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Drop's version codes count first-parent commits.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Internal signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CASSETTE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No internal key: the APK keeps the debug key and isn't uploaded to Drop."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/internal.keystore"
          echo "CASSETTE_KEYSTORE=$RUNNER_TEMP/internal.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew :app:android:assembleInternal :app:wear:assembleInternal
        env:
          CASSETTE_KEYSTORE_PASSWORD: ${{ secrets.CASSETTE_KEYSTORE_PASSWORD }}
          CASSETTE_KEY_ALIAS: ${{ secrets.CASSETTE_KEY_ALIAS }}
          CASSETTE_KEY_PASSWORD: ${{ secrets.CASSETTE_KEY_PASSWORD }}

      - name: Upload the Cassette APK
        uses: actions/upload-artifact@v7
        with:
          name: cassette-apk
          path: app/android/build/outputs/apk/internal/android-internal.apk

      - name: Upload the Wear APK
        uses: actions/upload-artifact@v7
        with:
          name: cassette-wear-apk
          path: app/wear/build/outputs/apk/internal/wear-internal.apk

      # To retrace stack traces from these Builds.
      - name: Upload the R8 mappings
        uses: actions/upload-artifact@v7
        with:
          name: r8-mappings
          path: |
            app/android/build/outputs/mapping/internal/mapping.txt
            app/wear/build/outputs/mapping/internal/mapping.txt

      - name: Upload to Drop
        id: upload
        if: >-
          steps.keystore.outputs.signed == 'true' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: r0adkll/drop/action@v0
        with:
          server: https://drop.thescavengers.software
          apk: app/android/build/outputs/apk/internal/android-internal.apk

      # Same run as the phone's, so Drop keeps them as sibling Builds; the Action reads the watch
      # feature from the APK and uploads it as a Wear Build (Drop 0.4.0, decision 0013).
      - name: Upload the watch app to Drop
        id: upload-wear
        if: steps.upload.outcome == 'success'
        uses: r0adkll/drop/action@v0
        with:
          server: https://drop.thescavengers.software
          apk: app/wear/build/outputs/apk/internal/wear-internal.apk

      - name: Link the Builds
        if: steps.upload.outcome == 'success'
        env:
          BUILD_URL: ${{ steps.upload.outputs.build-url }}
          WEAR_BUILD_URL: ${{ steps.upload-wear.outputs.build-url }}
        run: |
          echo "Drop Build: $BUILD_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$WEAR_BUILD_URL" ]; then
            echo "Drop Wear Build: $WEAR_BUILD_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  ios:
    name: iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # iOS ships in milestone 3; until then, shared code must keep compiling for it.
      - name: Compile for iOS
        run: ./gradlew compileKotlinIosSimulatorArm64 compileKotlinIosArm64
